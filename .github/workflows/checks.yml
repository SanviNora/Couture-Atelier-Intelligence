name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts dashboard
      - name: Tests (data-dependent tests skip; raw data is never committed)
        run: python -m pytest -q
      - name: Public bundle guard
        run: |
          python - <<'PY'
          from pathlib import Path
          from couture_atelier.public_bundle import check_bundle
          problems = check_bundle(Path("public_bundle"))
          assert not problems, problems
          print("public bundle passes the guard")
          PY
