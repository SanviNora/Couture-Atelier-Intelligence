project:
  name: Couture Atelier Intelligence
  type: portfolio simulation
  affiliated_brand: none

sources:
  - id: visuelle_2_0
    name: Visuelle 2.0
    role: observed fashion retail backbone (clients, stores, weekly sales, discounts, restocks)
    status: acquired_and_staged
    observed: true
    license: access by request form; cite the CVPRW 2022 paper; no redistribution of raw rows
    url: https://humaticslab.github.io/forecasting/visuelle
    supports:
      - client value and lapse modelling
      - store-level demand and stockout analysis
      - allocation against real restock decisions
      - full-price versus discount policy comparison
    limitations:
      - one Italian fast-fashion retailer, 2016 to 2021
      - prices are max-normalised for confidentiality
      - no consent, advisor, or outreach records

  - id: visuelle_gtrends
    name: Google Trends series shipped with Visuelle 2.0
    role: weekly search-interest signal by category, colour and fabric
    status: acquired_and_staged
    observed: true
    license: Google Trends terms, via the Visuelle 2.0 release
    url: https://humaticslab.github.io/forecasting/visuelle
    supports:
      - demand forecasting covariates
    limitations:
      - search interest is not sales
      - relative index, not absolute demand

  - id: couture_luxury_layer
    name: Couture Atelier calibrated luxury layer
    role: luxury prices, hero pieces, client value tiers, consent, advisors
    status: built
    observed: false
    license: project-created
    url: null
    supports:
      - VIC-centred client intelligence
      - clienteling with advisor capacity
      - scarce-piece allocation
    limitations:
      - modelled, not observed; every target and assumption is in configs/calibration.yml

  - id: published_benchmarks
    name: Published industry figures
    role: calibration targets and regulatory constraints
    status: cited
    observed: true
    license: cited reports (BCG-Altagamma, Bain, EU ESPR)
    url: null
    supports:
      - top-client spend concentration
      - destruction-ban inventory rules
    limitations:
      - industry aggregates, not brand-level data

  - id: uci_online_retail_ii
    name: UCI Online Retail II
    role: retired; former transaction source (UK giftware, 2009 to 2011)
    status: retired
    observed: true
    license: CC BY 4.0
    url: https://archive.ics.uci.edu/dataset/502/online+retail+ii
    supports: []
    limitations:
      - giftware with many wholesale buyers; not representative of fashion or luxury
