# Every number the luxury layer uses. Targets cite a published source;
# assumptions are labelled as project choices and are stress-tested later.

targets:
  vic_revenue_share:
    value: 0.30
    client_fraction: 0.01
    meaning: Share of a brand's revenue held by its VICs, taken here as the top 1% of clients.
    source: >-
      Coverage of the 2025 Altagamma luxury conference in Milan: VICs account for
      on average 30% of brands' revenues. Press-reported, and the VIC share of
      clients is not stated; top 1% is a project assumption.
    url: https://www.iads.org/member/news/takeaways-from-milan-luxury-conference-a-dual-challenge-with-aspirational-customers-and-vics

cross_checks:
  top_tier_market_share:
    value: 0.23
    meaning: >-
      Market-wide, the top 0.1% of luxury consumers hold over 23% of spend
      (excluding mobility and wellness) and spend over EUR 50,000 a year. This
      describes all luxury consumers across brands, so it is reported as a cross-
      check, not used as a single-brand target.
    source: BCG-Altagamma True-Luxury Global Consumer Insight 2025
    url: https://altagamma.it/media/source/Summary%20True-Luxury%20Global%20Consumer%20Insight%202025%20ENG_v05.docx
  top_tier_min_annual_spend_eur: 50000

regulation:
  eu_destruction_ban:
    effective: 2026-07-19
    meaning: Large companies may not destroy unsold apparel, accessories or footwear, including returns.
    source: Ecodesign for Sustainable Products Regulation, Delegated Regulation (EU) 2026/296
    url: https://cms.law/en/int/legal-updates/new-eu-rules-to-prevent-the-destruction-of-unsold-textiles

assumptions:
  price_ladder_eur:
    min: 650
    max: 9500
    meaning: >-
      Luxury ready-to-wear price range. The observed (normalised) price index is
      mapped onto this range by percentile on a log scale, so the retailer's own
      price ordering is kept.
  price_tiers:
    entry: 0.25
    core: 0.65
    high: 0.90
    meaning: Percentile cut points of the price ladder; above 0.90 is "exceptional".
  hero_share:
    value: 0.02
    meaning: Share of each season's products flagged as scarce hero pieces, chosen by full-price sales velocity.
  trade_up:
    cap_prior_visits: 12
    meaning: >-
      Each purchase is worth list value x (1 + min(prior visits, 12))^beta:
      clients trade up as the relationship deepens, levelling off after about a
      year of monthly visits. Only visits before the purchase count, so the layer
      never encodes a client's future. A first purchase keeps its list value.
      One global beta is fitted to the VIC revenue share target.
  non_client_rules:
    max_receipts_per_day: 10
    max_stores_per_day: 4
    max_lifetime_visits: 100
    meaning: >-
      IDs at or above the daily limits are shared or promotional cards; IDs with
      100+ visits are likely staff or personal-shopper accounts. Both are excluded
      from client modelling and kept in store demand.
  client_tiers:
    top_tier: 0.001
    vic: 0.01
    core: 0.10
    meaning: Cumulative top shares of clients by trailing 12-month spend at the as-of date; everyone else is "aspirational".
  consent:
    rate: 0.65
    meaning: >-
      Share of clients opted in to personalised contact. Drawn independently of
      behaviour so it cannot leak future visits.
  advisor_book_size:
    value: 250
    meaning: Clients per client advisor at their home store.
  flagship_share:
    value: 0.10
    meaning: Share of stores, by client volume, treated as flagships.
  seed: 42
