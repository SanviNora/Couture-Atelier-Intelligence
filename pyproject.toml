[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "couture-atelier-intelligence"
version = "0.1.0"
description = "Luxury retail forecasting, client intelligence, and inventory decision support."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pandera>=0.20",
    "scikit-learn>=1.5",
     "streamlit>=1.40",
     "plotly>=5.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.setuptools.packages.find]
where = ["src"]
